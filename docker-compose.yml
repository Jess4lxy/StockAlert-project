# StockAlert - base de datos local para desarrollo y pruebas.
# Las credenciales se leen del archivo .env (copiar .env.example), que no se sube al repositorio.

services:
  db:
    image: postgres:16-alpine
    container_name: stockalert-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    ports:
      # Solo desde esta computadora: nadie más en la red puede conectarse a la base
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stockalert-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockalert-data:
